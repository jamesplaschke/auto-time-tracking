[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boston-transit"
version = "0.1.0"
description = "Never Miss the T — Real-time MBTA subway dashboard"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.0.0",
]

[project.scripts]
boston-transit = "backend.main:run"
